
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Moto X3M Pool Party</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    #gameContainer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    #game-iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <main id="gameContainer">
    <iframe
      id="game-iframe"
      src="https://play.famobi.com/moto-x3m-pool-party"
      title="Moto X3M Pool Party"
      allow="autoplay; fullscreen; gamepad"
      allowfullscreen
      scrolling="no">
    </iframe>
  </main>
</body>
</html>
